<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubase</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            corePlugins: {
                borderRadius: false,
            },
            theme: {
                extend: {
                    colors: {
                        // Dark mode: pure black/gray
                        dark: {
                            bg: '#000000',
                            surface: '#111111',
                            border: '#333333',
                            hover: '#1a1a1a',
                            text: '#e5e5e5',
                            muted: '#888888'
                        },
                        // Light mode: beige/cream (Anthropic-like)
                        light: {
                            bg: '#f5f2eb',
                            surface: '#ffffff',
                            border: '#e6e4dc',
                            hover: '#f0ede5',
                            text: '#1a1a1a',
                            muted: '#6b6b6b',
                            menu: '#faf9f6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/cubejs/styles.css">
</head>
<body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text transition-colors flex flex-col h-screen overflow-hidden">
    
    <!-- Header -->
    <header class="bg-light-menu dark:bg-dark-surface border-b border-light-border dark:border-dark-border z-20 flex-shrink-0 h-16 flex items-center px-4 justify-between">
        <div class="flex items-center">
            <button id="mobile-menu-btn" class="md:hidden mr-4 text-xl p-2 hover:bg-light-hover dark:hover:bg-dark-hover">
                <i class="fa-solid fa-bars text-light-text dark:text-dark-text"></i>
            </button>
            <h1 class="text-2xl font-bold font-serif text-light-text dark:text-dark-text">
                Cubase <i class="fa-solid fa-cube ml-1"></i>
            </h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <button id="theme-toggle" class="p-2 hover:bg-light-hover dark:hover:bg-dark-hover transition">
                <i class="fa-solid fa-sun text-light-text dark:hidden"></i>
                <i class="fa-solid fa-moon hidden dark:inline text-dark-text"></i>
            </button>
            <div class="w-8 h-8 bg-light-text dark:bg-dark-text flex items-center justify-center text-light-bg dark:text-dark-bg font-bold cursor-pointer">
                U
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-light-surface dark:bg-dark-surface border-r border-light-border dark:border-dark-border shadow-md hidden md:flex flex-col h-full">
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 bg-light-menu dark:bg-dark-surface">
                <a href="#explore" class="nav-link block p-3 hover:bg-light-hover dark:hover:bg-dark-hover font-medium font-serif">
                    <i class="fa-solid fa-compass w-6 text-light-muted dark:text-dark-muted"></i> <span class="text-light-text dark:text-dark-text">Explore</span>
                </a>
                <a href="#playground" class="nav-link block p-3 hover:bg-light-hover dark:hover:bg-dark-hover font-medium font-serif">
                    <i class="fa-solid fa-cube w-6 text-light-muted dark:text-dark-muted"></i> <span class="text-light-text dark:text-dark-text">Playground</span>
                </a>
                <a href="#mysets" class="nav-link block p-3 hover:bg-light-hover dark:hover:bg-dark-hover font-medium font-serif">
                    <i class="fa-solid fa-layer-group w-6 text-light-muted dark:text-dark-muted"></i> <span class="text-light-text dark:text-dark-text">My Sets</span>
                </a>
                <a href="#trainer" class="nav-link block p-3 hover:bg-light-hover dark:hover:bg-dark-hover font-medium font-serif">
                    <i class="fa-solid fa-dumbbell w-6 text-light-muted dark:text-dark-muted"></i> <span class="text-light-text dark:text-dark-text">Trainer</span>
                </a>
                <a href="#export" class="nav-link block p-3 hover:bg-light-hover dark:hover:bg-dark-hover font-medium font-serif">
                    <i class="fa-solid fa-file-pdf w-6 text-light-muted dark:text-dark-muted"></i> <span class="text-light-text dark:text-dark-text">Export PDF</span>
                </a>
                
                <hr class="my-4 border-light-border dark:border-dark-border">
                
                <div id="tree-menu" class="hidden">
                    <h3 class="px-3 text-xs font-semibold text-light-muted dark:text-dark-muted uppercase tracking-wider mb-2 font-serif">Categories</h3>
                    <div id="tree-container" class="space-y-1"></div>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 bg-light-bg dark:bg-dark-bg relative h-full">
            <div id="app-view"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
